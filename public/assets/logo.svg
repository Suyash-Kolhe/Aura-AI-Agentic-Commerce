  <!-- Text "AI" - amber to purple to indigo gradient -->
  <text x="96" y="23.5" font-family="'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.025em" fill="url(#auraAiGrad)">AI</text>
