<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgCam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F4F0"/>
      <stop offset="100%" stop-color="#DFDAD0"/>
    </linearGradient>
    <radialGradient id="shadowCam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="magBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="45%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#064E3B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09090B"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgCam)"/>
  <path d="M0 345 L600 345 L600 450 L0 450 Z" fill="#E0DBD1"/>
  <line x1="0" y1="345" x2="600" y2="345" stroke="#CBC4B8" stroke-width="1.5"/>

  <ellipse cx="300" cy="366" rx="200" ry="24" fill="url(#shadowCam)"/>

  <!-- EVF Electronic Viewfinder Hump -->
  <path d="M232 108 L368 108 L384 148 L216 148 Z" fill="url(#magBody)" stroke="#52525B" stroke-width="2"/>
  <rect x="275" y="100" width="50" height="8" rx="2" fill="#71717A"/>

  <!-- Top Mode Dials & Red Shutter Accent -->
  <rect x="166" y="132" width="38" height="16" rx="3" fill="#52525B"/>
  <rect x="394" y="128" width="44" height="20" rx="3" fill="#3F3F46" stroke="#71717A" stroke-width="1"/>
  <rect x="444" y="136" width="22" height="12" rx="3" fill="#DC2626"/>

  <!-- Main Full-Frame Camera Body -->
  <rect x="136" y="146" width="328" height="196" rx="22" fill="url(#magBody)" stroke="#52525B" stroke-width="2.5"/>
  <!-- Left Ergonomic Grip -->
  <rect x="136" y="156" width="68" height="186" rx="18" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>

  <!-- Red Brand Badge & Model -->
  <rect x="398" y="170" width="42" height="14" rx="3" fill="#E11D48"/>
  <text x="419" y="180" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="9">S5 4K</text>

  <!-- Full-Frame 28-70mm f/2.8 Lens Barrel & Multi-Coated Optics -->
  <circle cx="310" cy="246" r="96" fill="#27272A" stroke="#A1A1AA" stroke-width="3"/>
  <circle cx="310" cy="246" r="84" fill="#18181B" stroke="#EA580C" stroke-width="2.5"/>
  <circle cx="310" cy="246" r="70" fill="#09090B" stroke="#52525B" stroke-width="4" stroke-dasharray="6 3"/>
  <circle cx="310" cy="246" r="56" fill="url(#lensGlass)" stroke="#3F3F46" stroke-width="2"/>
  <circle cx="310" cy="246" r="24" fill="#09090B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Optical Flare Highlights -->
  <ellipse cx="290" cy="224" rx="16" ry="9" fill="#FFFFFF" fill-opacity="0.35" transform="rotate(-30 290 224)"/>
  <circle cx="332" cy="268" r="6" fill="#34D399" fill-opacity="0.45"/>
</svg>
