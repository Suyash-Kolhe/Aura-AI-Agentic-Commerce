<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgWatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F6"/>
      <stop offset="60%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>
    <radialGradient id="shadowWatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titaniumCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4D4D8"/>
      <stop offset="35%" stop-color="#A1A1AA"/>
      <stop offset="70%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgWatch)"/>
  <path d="M0 350 L600 350 L600 450 L0 450 Z" fill="#DDDDDF"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#C8C8CC" stroke-width="1.5"/>

  <ellipse cx="300" cy="382" rx="135" ry="22" fill="url(#shadowWatch)"/>

  <!-- Top & Bottom Fluoroelastomer Ribbed Strap -->
  <path d="M248 68 L352 68 L362 138 L238 138 Z" fill="#27272A"/>
  <line x1="252" y1="84" x2="348" y2="84" stroke="#3F3F46" stroke-width="4" stroke-linecap="round"/>
  <line x1="248" y1="102" x2="352" y2="102" stroke="#3F3F46" stroke-width="4" stroke-linecap="round"/>
  <line x1="244" y1="120" x2="356" y2="120" stroke="#3F3F46" stroke-width="4" stroke-linecap="round"/>

  <path d="M238 312 L362 312 L352 382 L248 382 Z" fill="#27272A"/>
  <line x1="244" y1="330" x2="356" y2="330" stroke="#3F3F46" stroke-width="4" stroke-linecap="round"/>
  <line x1="248" y1="348" x2="352" y2="348" stroke="#3F3F46" stroke-width="4" stroke-linecap="round"/>
  <line x1="252" y1="366" x2="348" y2="366" stroke="#3F3F46" stroke-width="4" stroke-linecap="round"/>

  <!-- Digital Crown & Action Button -->
  <rect x="382" y="176" width="14" height="36" rx="5" fill="url(#titaniumCase)" stroke="#52525B" stroke-width="1.5"/>
  <rect x="384" y="184" width="10" height="20" rx="2" fill="#EA580C"/>
  <rect x="205" y="215" width="10" height="42" rx="4" fill="#EA580C"/>

  <!-- Brushed Grade 5 Titanium Chassis -->
  <rect x="212" y="126" width="176" height="198" rx="40" fill="url(#titaniumCase)" stroke="#E4E4E7" stroke-width="2"/>
  <rect x="222" y="136" width="156" height="178" rx="32" fill="url(#screenGlow)" stroke="#3F3F46" stroke-width="2"/>

  <!-- Sapphire Chronograph Telemetry Face -->
  <circle cx="300" cy="225" r="58" fill="none" stroke="#27272A" stroke-width="4"/>
  <circle cx="300" cy="225" r="58" fill="none" stroke="#007AFF" stroke-width="4" stroke-dasharray="260 365" stroke-linecap="round" transform="rotate(-90 300 225)"/>
  <text x="300" y="218" text-anchor="middle" fill="#FAFAFA" font-family="monospace" font-weight="700" font-size="30">09:41</text>
  <text x="300" y="242" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">TITANIUM GPS</text>
  <text x="300" y="262" text-anchor="middle" fill="#A1A1AA" font-family="monospace" font-size="10">14D BATT · 68 BPM</text>
</svg>
