<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgLap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3EF"/>
      <stop offset="60%" stop-color="#E7E4DD"/>
      <stop offset="100%" stop-color="#D7D2C8"/>
    </linearGradient>
    <radialGradient id="shadowLap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oledScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="45%" stop-color="#4338CA"/>
      <stop offset="75%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="aluminumDeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525B"/>
      <stop offset="50%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#3F3F46"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgLap)"/>
  <path d="M0 345 L600 345 L600 450 L0 450 Z" fill="#DFDBD2"/>
  <line x1="0" y1="345" x2="600" y2="345" stroke="#CBC5B9" stroke-width="1.5"/>

  <ellipse cx="300" cy="368" rx="235" ry="22" fill="url(#shadowLap)"/>

  <!-- Display Lid Outer Frame -->
  <rect x="128" y="88" width="344" height="222" rx="14" fill="#18181B" stroke="#52525B" stroke-width="2"/>
  <!-- 16" 4K OLED Display Panel -->
  <rect x="138" y="98" width="324" height="200" rx="8" fill="url(#oledScreen)"/>
  <!-- Camera Notch -->
  <rect x="278" y="98" width="44" height="8" rx="3" fill="#09090B"/>
  <circle cx="300" cy="102" r="2" fill="#38BDF8"/>

  <!-- Abstract OLED Wallpaper Ribbons -->
  <path d="M138 245 C210 175, 290 275, 462 155 L462 298 L138 298 Z" fill="#F472B6" fill-opacity="0.28"/>
  <path d="M138 268 C240 205, 340 265, 462 195 L462 298 L138 298 Z" fill="#38BDF8" fill-opacity="0.32"/>
  <!-- Floating Studio UI Window -->
  <rect x="172" y="128" width="160" height="98" rx="8" fill="#09090B" fill-opacity="0.68" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <circle cx="184" cy="140" r="3" fill="#F87171"/>
  <circle cx="194" cy="140" r="3" fill="#FBBF24"/>
  <circle cx="204" cy="140" r="3" fill="#34D399"/>
  <line x1="184" y1="158" x2="270" y2="158" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="184" y1="172" x2="305" y2="172" stroke="#E4E4E7" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="184" y1="186" x2="250" y2="186" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="348" y="142" width="82" height="84" rx="8" fill="#09090B" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <circle cx="389" cy="184" r="24" fill="none" stroke="#34D399" stroke-width="4" stroke-dasharray="110 160"/>

  <!-- Hinge -->
  <rect x="235" y="308" width="130" height="6" rx="2" fill="#27272A"/>

  <!-- Unibody Aluminum Base Deck -->
  <path d="M88 312 L512 312 L532 346 C534 352, 528 358, 518 358 L82 358 C72 358, 66 352, 68 346 Z" fill="url(#aluminumDeck)" stroke="#A1A1AA" stroke-width="1.2"/>
  <!-- Keyboard Well Perspective -->
  <polygon points="134,316 466,316 478,336 122,336" fill="#18181B"/>
  <!-- Trackpad Notch -->
  <polygon points="248,339 352,339 356,352 244,352" fill="#3F3F46" stroke="#71717A" stroke-width="0.8"/>
  <rect x="272" y="352" width="56" height="4" rx="2" fill="#27272A"/>
</svg>
