<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3F7"/>
      <stop offset="100%" stop-color="#E2DCEA"/>
    </linearGradient>
    <radialGradient id="shadowHand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="consoleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="hdrScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgHand)"/>
  <path d="M0 345 L600 345 L600 450 L0 450 Z" fill="#DDD6E6"/>
  <line x1="0" y1="345" x2="600" y2="345" stroke="#C6BDD4" stroke-width="1.5"/>

  <ellipse cx="300" cy="362" rx="245" ry="22" fill="url(#shadowHand)"/>

  <!-- Shoulder Bumper Triggers -->
  <rect x="92" y="128" width="68" height="14" rx="6" fill="#52525B"/>
  <rect x="440" y="128" width="68" height="14" rx="6" fill="#52525B"/>

  <!-- Ergonomic Portable Handheld Chassis -->
  <rect x="64" y="136" width="472" height="196" rx="58" fill="url(#consoleBody)" stroke="#52525B" stroke-width="2.5"/>

  <!-- 7.4" HDR OLED 90Hz Widescreen Display -->
  <rect x="164" y="152" width="272" height="164" rx="12" fill="#09090B" stroke="#3F3F46" stroke-width="2"/>
  <rect x="174" y="162" width="252" height="144" rx="8" fill="url(#hdrScreen)"/>
  <!-- Sci-Fi Horizon Game HUD on OLED Screen -->
  <polygon points="174,306 258,236 332,278 386,218 426,306" fill="#1E1B4B" fill-opacity="0.75"/>
  <circle cx="348" cy="204" r="22" fill="#F472B6" fill-opacity="0.8"/>
  <rect x="188" y="174" width="76" height="16" rx="4" fill="#09090B" fill-opacity="0.65"/>
  <text x="226" y="185" text-anchor="middle" fill="#34D399" font-family="monospace" font-weight="700" font-size="9">90 FPS · HDR</text>

  <!-- Left RGB Hall-Effect Thumbstick + D-Pad -->
  <circle cx="118" cy="198" r="20" fill="#18181B" stroke="#A855F7" stroke-width="3"/>
  <circle cx="118" cy="198" r="12" fill="#27272A"/>
  <!-- Cross D-Pad -->
  <rect x="108" y="242" width="14" height="38" rx="3" fill="#18181B"/>
  <rect x="96" y="254" width="38" height="14" rx="3" fill="#18181B"/>

  <!-- Right ABXY Buttons + RGB Hall-Effect Thumbstick -->
  <circle cx="482" cy="182" r="7" fill="#F59E0B"/>
  <circle cx="498" cy="198" r="7" fill="#EF4444"/>
  <circle cx="466" cy="198" r="7" fill="#3B82F6"/>
  <circle cx="482" cy="214" r="7" fill="#10B981"/>

  <circle cx="476" cy="264" r="20" fill="#18181B" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="476" cy="264" r="12" fill="#27272A"/>
</svg>
