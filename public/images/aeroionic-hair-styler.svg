<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4F6"/>
      <stop offset="100%" stop-color="#E4DCE2"/>
    </linearGradient>
    <radialGradient id="shadowHair" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fuchsiaSatin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="55%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
    <linearGradient id="slateStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="50%" stop-color="#52525B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgHair)"/>
  <path d="M0 355 L600 355 L600 450 L0 450 Z" fill="#DFD5DC"/>
  <line x1="0" y1="355" x2="600" y2="355" stroke="#C9BCC5" stroke-width="1.5"/>

  <ellipse cx="300" cy="378" rx="165" ry="20" fill="url(#shadowHair)"/>

  <!-- Brushless Digital Motor Handle -->
  <rect x="242" y="186" width="44" height="186" rx="18" fill="url(#slateStem)" stroke="#52525B" stroke-width="2"/>
  <rect x="246" y="340" width="36" height="22" rx="6" fill="url(#fuchsiaSatin)"/>
  <!-- Handle Power & Cold Shot Buttons -->
  <circle cx="264" cy="216" r="5" fill="#F43F5E"/>
  <circle cx="264" cy="236" r="5" fill="#38BDF8"/>

  <!-- Supersonic Hollow Cylindrical Head -->
  <rect x="192" y="86" width="144" height="106" rx="52" fill="#27272A" stroke="#52525B" stroke-width="2"/>
  <!-- Satin Fuchsia Outer Ring & Hollow Airflow Tunnel -->
  <circle cx="256" cy="139" r="48" fill="url(#fuchsiaSatin)" stroke="#F9A8D4" stroke-width="2"/>
  <circle cx="256" cy="139" r="26" fill="url(#bgHair)" stroke="#18181B" stroke-width="6"/>
  <!-- LED Temp & Speed Indicators -->
  <circle cx="226" cy="139" r="3" fill="#FFFFFF"/>
  <circle cx="286" cy="139" r="3" fill="#F43F5E"/>

  <!-- Magnetic Coanda Smoothing Nozzle Accessory on Right -->
  <path d="M376 286 L432 256 L444 358 L368 358 Z" fill="#27272A" stroke="#52525B" stroke-width="2"/>
  <rect x="368" y="346" width="76" height="14" rx="4" fill="url(#fuchsiaSatin)"/>
</svg>
