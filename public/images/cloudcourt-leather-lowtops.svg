<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgCourt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F4F0"/>
      <stop offset="100%" stop-color="#E1DDD4"/>
    </linearGradient>
    <radialGradient id="shadowCourt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nappaLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgCourt)"/>
  <path d="M0 345 L600 345 L600 450 L0 450 Z" fill="#DCD7CC"/>
  <line x1="0" y1="345" x2="600" y2="345" stroke="#C8C2B4" stroke-width="1.5"/>

  <ellipse cx="300" cy="360" rx="215" ry="20" fill="url(#shadowCourt)"/>

  <!-- Supple Nappa Leather Upper -->
  <path d="M118 286 C116 232, 136 184, 168 176 C198 206, 245 206, 274 166 L386 228 C432 238, 476 248, 488 286 Z" fill="url(#nappaLeather)" stroke="#D4D4D8" stroke-width="2"/>

  <!-- Indigo Suede Heel Tab & Side Court Panel -->
  <path d="M128 196 C142 182, 160 176, 174 182 L166 222 L122 222 Z" fill="#4338CA"/>
  <path d="M188 242 L346 226 L332 262 L176 268 Z" fill="#E0E7FF" stroke="#818CF8" stroke-width="1.5"/>

  <!-- Perforated Breathable Detail Dots -->
  <g fill="#A1A1AA">
    <circle cx="220" cy="252" r="2"/>
    <circle cx="235" cy="250" r="2"/>
    <circle cx="250" cy="248" r="2"/>
    <circle cx="265" cy="246" r="2"/>
    <circle cx="280" cy="244" r="2"/>
  </g>

  <!-- Cotton Flat Laces -->
  <g stroke="#E4E4E7" stroke-width="5" stroke-linecap="round">
    <line x1="284" y1="180" x2="304" y2="170"/>
    <line x1="306" y1="194" x2="326" y2="184"/>
    <line x1="328" y1="208" x2="348" y2="198"/>
    <line x1="350" y1="222" x2="370" y2="212"/>
  </g>

  <!-- Vintage Margom Gum Cupsole -->
  <rect x="112" y="284" width="382" height="42" rx="12" fill="#F5F5F0" stroke="#D6D3D1" stroke-width="2"/>
  <line x1="118" y1="296" x2="488" y2="296" stroke="#D6D3D1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="118" y="320" width="370" height="10" rx="4" fill="#D97706" fill-opacity="0.75"/>
</svg>
