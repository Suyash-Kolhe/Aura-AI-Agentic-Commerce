<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgAir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7F8"/>
      <stop offset="100%" stop-color="#DDE6EA"/>
    </linearGradient>
    <radialGradient id="shadowAir" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purifierBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgAir)"/>
  <path d="M0 355 L600 355 L600 450 L0 450 Z" fill="#D5DFE4"/>
  <line x1="0" y1="355" x2="600" y2="355" stroke="#BFCBD2" stroke-width="1.5"/>

  <ellipse cx="300" cy="378" rx="145" ry="20" fill="url(#shadowAir)"/>

  <!-- Cylindrical HEPA-14 Smart Purifier Tower -->
  <rect x="206" y="72" width="188" height="302" rx="34" fill="url(#purifierBody)" stroke="#94A3B8" stroke-width="2"/>

  <!-- Top Aerodynamic Vortex Diffuser Grille -->
  <ellipse cx="300" cy="92" rx="76" ry="16" fill="#1E293B" stroke="#2DD4BF" stroke-width="2"/>
  <ellipse cx="300" cy="92" rx="48" ry="9" fill="none" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Circular Laser PM2.5 OLED Display -->
  <circle cx="300" cy="166" r="42" fill="#0F172A" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="300" cy="166" r="34" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="170 220"/>
  <text x="300" y="164" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-weight="700" font-size="18">PM 003</text>
  <text x="300" y="180" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-weight="600" font-size="8" letter-spacing="1">HEPA-14 PURE</text>

