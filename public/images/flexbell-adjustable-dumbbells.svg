<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F5F7"/>
      <stop offset="100%" stop-color="#DCE0E6"/>
    </linearGradient>
    <radialGradient id="shadowGym" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steelPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="chromeGrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F5"/>
      <stop offset="50%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgGym)"/>
  <path d="M0 345 L600 345 L600 450 L0 450 Z" fill="#D4D9E0"/>
  <line x1="0" y1="345" x2="600" y2="345" stroke="#BEC5CE" stroke-width="1.5"/>

  <ellipse cx="300" cy="362" rx="235" ry="24" fill="url(#shadowGym)"/>

  <!-- Cradle Dock Base -->
  <path d="M96 312 L504 312 L488 352 L112 352 Z" fill="#27272A" stroke="#52525B" stroke-width="2"/>
  <rect x="246" y="324" width="108" height="18" rx="4" fill="#09090B" stroke="#10B981" stroke-width="1.2"/>
  <text x="300" y="337" text-anchor="middle" fill="#34D399" font-family="monospace" font-weight="700" font-size="10">5 – 52.5 LBS</text>

  <!-- Central Knurled Chrome Twist-Dial Handle -->
  <rect x="218" y="214" width="164" height="36" rx="6" fill="url(#chromeGrip)" stroke="#3F3F46" stroke-width="2"/>
  <!-- Twist-Select Weight Readout Window -->
  <rect x="274" y="220" width="52" height="24" rx="4" fill="#09090B" stroke="#10B981" stroke-width="1.5"/>
  <text x="300" y="236" text-anchor="middle" fill="#34D399" font-family="monospace" font-weight="700" font-size="13">52.5</text>

  <!-- Left Machined Steel Plate Stack (5 Nested Plates) -->
  <g fill="url(#steelPlate)" stroke="#52525B" stroke-width="1.5">
    <rect x="192" y="138" width="24" height="188" rx="6"/>
    <rect x="166" y="144" width="24" height="176" rx="6"/>
    <rect x="140" y="150" width="24" height="164" rx="6"/>
    <rect x="114" y="156" width="24" height="152" rx="6"/>
    <rect x="88" y="164" width="24" height="136" rx="6"/>
  </g>
  <!-- Left Dial Cap -->
  <rect x="74" y="198" width="14" height="68" rx="4" fill="#10B981"/>

  <!-- Right Machined Steel Plate Stack (5 Nested Plates) -->
  <g fill="url(#steelPlate)" stroke="#52525B" stroke-width="1.5">
    <rect x="384" y="138" width="24" height="188" rx="6"/>
    <rect x="410" y="144" width="24" height="176" rx="6"/>
    <rect x="436" y="150" width="24" height="164" rx="6"/>
    <rect x="462" y="156" width="24" height="152" rx="6"/>
    <rect x="488" y="164" width="24" height="136" rx="6"/>
  </g>
  <!-- Right Dial Cap -->
  <rect x="512" y="198" width="14" height="68" rx="4" fill="#10B981"/>
</svg>
