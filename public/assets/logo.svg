  </defs>

  <!-- Badge Squircle -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="url(#auraBadgeBg)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Lightning Bolt Icon -->
  <path d="M17.5 4.5L8.5 16h6.5l-1.5 11.5 9-11.5h-6.5l1.5-11.5z" fill="url(#auraBoltGrad)"/>

  <!-- Text "Aura" - pure off-white with NO background -->
