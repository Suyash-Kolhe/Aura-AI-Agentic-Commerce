<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgPhone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F6"/>
      <stop offset="100%" stop-color="#DDDCE2"/>
    </linearGradient>
    <radialGradient id="shadowPhone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.26"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titaniumBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525B"/>
      <stop offset="50%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amoledScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1D4ED8"/>
      <stop offset="75%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgPhone)"/>
  <path d="M0 350 L600 350 L600 450 L0 450 Z" fill="#DFDFE4"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#C8C8D0" stroke-width="1.5"/>

  <ellipse cx="300" cy="378" rx="185" ry="22" fill="url(#shadowPhone)"/>

  <!-- Rear Titanium Smartphone Chassis (Left) -->
  <g transform="rotate(-6 225 225)">
    <rect x="145" y="72" width="152" height="296" rx="26" fill="url(#titaniumBack)" stroke="#A1A1AA" stroke-width="2.5"/>
    <!-- Camera Island -->
    <rect x="159" y="86" width="88" height="102" rx="18" fill="#18181B" stroke="#71717A" stroke-width="1.5"/>
    <!-- 200MP Triple Lens Array -->
    <circle cx="184" cy="111" r="17" fill="#09090B" stroke="#D4D4D8" stroke-width="2"/>
    <circle cx="184" cy="111" r="8" fill="#1E3A8A"/>
    <circle cx="181" cy="108" r="2.5" fill="#93C5FD"/>

    <circle cx="184" cy="158" r="17" fill="#09090B" stroke="#D4D4D8" stroke-width="2"/>
    <circle cx="184" cy="158" r="8" fill="#312E81"/>

    <circle cx="223" cy="134" r="15" fill="#09090B" stroke="#D4D4D8" stroke-width="2"/>
    <rect x="217" y="128" width="12" height="12" rx="2" fill="#065F46"/>
    <!-- Laser AF & LED Flash -->
    <circle cx="223" cy="102" r="5" fill="#FEF08A"/>
    <circle cx="223" cy="166" r="5" fill="#E11D48"/>
    <text x="221" y="336" text-anchor="middle" fill="#A1A1AA" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="2">ZENITH X1</text>
  </g>

  <!-- Front LTPO AMOLED Smartphone (Right Overlapping) -->
  <g transform="rotate(5 375 230)">
    <rect x="292" y="74" width="154" height="298" rx="26" fill="#09090B" stroke="#D4D4D8" stroke-width="2.5"/>
    <rect x="299" y="81" width="140" height="284" rx="21" fill="url(#amoledScreen)"/>
    <!-- Glowing Wallpaper Orbs -->
    <circle cx="369" cy="215" r="52" fill="#38BDF8" fill-opacity="0.35"/>
    <circle cx="350" cy="245" r="38" fill="#F472B6" fill-opacity="0.4"/>
    <!-- Dynamic Island Punch-Hole -->
    <rect x="349" y="89" width="40" height="11" rx="5.5" fill="#09090B"/>
    <!-- Lockscreen Clock -->
    <text x="369" y="146" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="34">09:41</text>
    <text x="369" y="164" text-anchor="middle" fill="#E0E7FF" font-family="sans-serif" font-size="10" letter-spacing="1">5G ULTRA · 120HZ LTPO</text>
    <!-- Bottom Home Bar -->
    <rect x="344" y="354" width="50" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>
</svg>
