    <circle cx="238" cy="292" r="2.5"/><circle cx="258" cy="292" r="2.5"/><circle cx="278" cy="292" r="2.5"/><circle cx="298" cy="292" r="2.5"/><circle cx="318" cy="292" r="2.5"/><circle cx="338" cy="292" r="2.5"/><circle cx="358" cy="292" r="2.5"/>
