<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgDenim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#E2E4EB"/>
    </linearGradient>
    <radialGradient id="shadowDenim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#09090B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="indigoSelvedge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgDenim)"/>
  <path d="M0 355 L600 355 L600 450 L0 450 Z" fill="#DCDEE6"/>
  <line x1="0" y1="355" x2="600" y2="355" stroke="#C6C9D4" stroke-width="1.5"/>

  <ellipse cx="300" cy="382" rx="165" ry="20" fill="url(#shadowDenim)"/>

  <!-- Sleeves -->
  <path d="M192 104 L126 286 L168 298 L212 156 Z" fill="url(#indigoSelvedge)" stroke="#0F172A" stroke-width="2"/>
  <path d="M408 104 L474 286 L432 298 L388 156 Z" fill="url(#indigoSelvedge)" stroke="#0F172A" stroke-width="2"/>

  <!-- Type-III Selvedge Jacket Body -->
  <rect x="192" y="92" width="216" height="248" rx="10" fill="url(#indigoSelvedge)" stroke="#0F172A" stroke-width="2"/>
  <!-- Waistband Hem -->
  <rect x="192" y="318" width="216" height="24" rx="4" fill="#172554" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Spread Collar -->
  <polygon points="248,74 352,74 368,108 300,118 232,108" fill="#172554" stroke="#D97706" stroke-width="1.5"/>
  <polygon points="264,82 336,82 300,122" fill="#334155"/>

  <!-- Center Selvedge Placket + Copper Buttons -->
  <rect x="288" y="114" width="24" height="226" fill="#172554" stroke="#D97706" stroke-width="1.4" stroke-dasharray="4 2"/>
  <line x1="310" y1="114" x2="310" y2="340" stroke="#EF4444" stroke-width="1.5"/>
  <g fill="#D97706" stroke="#FEF3C7" stroke-width="1">
    <circle cx="300" cy="136" r="4.5"/>
    <circle cx="300" cy="176" r="4.5"/>
    <circle cx="300" cy="216" r="4.5"/>
    <circle cx="300" cy="256" r="4.5"/>
    <circle cx="300" cy="296" r="4.5"/>
    <circle cx="300" cy="330" r="4.5"/>
  </g>

  <!-- Dual Chest Flap Pockets & V-Seam -->
  <rect x="212" y="152" width="58" height="62" rx="4" fill="#1E293B" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="212,152 270,152 270,172 241,182 212,172" fill="#172554" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="241" cy="173" r="3.5" fill="#D97706"/>

  <rect x="330" y="152" width="58" height="62" rx="4" fill="#1E293B" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="330,152 388,152 388,172 359,182 330,172" fill="#172554" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="359" cy="173" r="3.5" fill="#D97706"/>

  <!-- Classic Type-III V-Stitching -->
  <line x1="222" y1="214" x2="236" y2="318" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 2"/>
  <line x1="378" y1="214" x2="364" y2="318" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 2"/>
</svg>
